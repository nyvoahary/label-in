<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Label-in · {{ root }}</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --panel-2: #1f242d;
    --border: #2a3140;
    --text: #e6e8ee;
    --muted: #8a93a6;
    --accent: #f59e0b;
    --done: #22c55e;
    --pending: #eab308;
  }
  .light-theme {
    --bg: #f7f8fb;
    --panel: #ffffff;
    --panel-2: #f3f6fb;
    --border: #d9e2ec;
    --text: #111827;
    --muted: #6b7280;
    --accent: #f59e0b;
    --done: #22c55e;
    --pending: #eab308;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
  .logo { filter: invert(1); transition: filter .2s ease; }
  .light-theme .logo { filter: none; }
  .app { display: grid; grid-template-columns: 400px 1fr; height: 100vh; }
  .sidebar { background: var(--panel); border-right: 1px solid var(--border);
    display: flex; flex-direction: column; min-height: 0; }
  .sidebar header { padding: 14px 16px; border-bottom: 1px solid var(--border); }
  .sidebar header h1 { font-size: 14px; margin: 0; font-weight: 600; }
  .sidebar header .sub { font-size: 11px; color: var(--muted); margin-top: 4px; }
  .project-picker { padding: 10px 16px; border-bottom: 1px solid var(--border); }
  .project-picker label { font-size: 10px; color: var(--muted); text-transform: uppercase;
    letter-spacing: .05em; display: block; margin-bottom: 6px; }
  .project-picker select { width: 100%; background: var(--panel-2); color: var(--text);
    border: 1px solid var(--border); border-radius: 6px; padding: 6px 8px; font-size: 12px; }
  .progress { padding: 10px 16px; border-bottom: 1px solid var(--border); font-size: 12px; color: var(--muted); }
  .progress-bar { height: 4px; background: var(--panel-2); border-radius: 2px; margin-top: 6px; overflow: hidden; }
  .progress-bar > div { height: 100%; background: var(--done); transition: width .2s; }
  .filter { padding: 8px 16px; border-bottom: 1px solid var(--border); display: flex; gap: 6px; }
  .filter button { flex: 1; background: var(--panel-2); color: var(--text); border: 1px solid var(--border);
    border-radius: 6px; padding: 5px 8px; font-size: 11px; cursor: pointer; }
  .filter button.active { background: var(--accent); border-color: var(--accent); color: white; }
  .task-list { flex: 1; overflow-y: auto; }
  .task-item { padding: 10px 16px; border-bottom: 1px solid var(--border); cursor: pointer; font-size: 12px; }
  .task-item:hover { background: var(--panel-2); }
  .task-item.active { background: var(--panel-2); border-left: 3px solid var(--accent); padding-left: 13px; }
  .task-item .row1 { display: flex; justify-content: space-between; align-items: center; }
  .task-item .idx { color: var(--muted); font-variant-numeric: tabular-nums; font-size: 11px; }
  .task-item .badge { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
  .badge.done { background: var(--done); }
  .badge.pending { background: var(--pending); }
  .badge.review { background: #ef4444; }
  .badge.autosave { background: #90D6FF; }
  .badge.excluded { background: transparent; border: 2px solid var(--muted); width: 9px; height: 9px; }

  /* PROVA-MG convention panel */
  .conv { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 12px 14px; margin-top: 12px; }
  .conv-head { display: flex; align-items: center; gap: 10px; font-size: 12px; color: var(--muted); margin-bottom: 10px; flex-wrap: wrap; }
  .conv-head b { color: var(--text); }
  .conv-head .conv-state { padding: 1px 8px; border-radius: 8px; border: 1px solid var(--border); font-size: 11px; }
  .conv-head .conv-state.ok { color: var(--done); border-color: rgba(34,197,94,.4); }
  .conv-head .conv-state.old { color: var(--pending); border-color: rgba(234,179,8,.4); }
  .conv-head a { margin-left: auto; color: var(--accent); text-decoration: none; }
  .conv-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 10px 16px; }
  .conv .field { min-width: 0; border-radius: 6px; padding: 4px 6px; margin: -4px -6px; border: 1px dashed transparent; }
  .conv .field.wide { grid-column: 1 / -1; }
  .conv .field > label, .conv .field > .flabel { display: block; font-size: 10px; color: var(--muted); text-transform: uppercase;
    letter-spacing: .05em; margin-bottom: 5px; }
  .conv .field.unconfirmed { border-color: var(--accent); background: rgba(245,158,11,.06); }
  .conv .field .todo { display: none; color: var(--accent); text-transform: none; letter-spacing: 0; margin-left: 6px; }
  .conv .field.unconfirmed .todo { display: inline; }
  .conv .field.missing { border-color: #ef4444; }
  .conv .seg { display: flex; flex-wrap: wrap; gap: 4px; }
  .conv .seg button { background: var(--panel-2); color: var(--text); border: 1px solid var(--border); border-radius: 5px;
    padding: 4px 9px; font-size: 12px; cursor: pointer; }
  .conv .seg button:hover { border-color: var(--accent); }
  .conv .seg button.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  .conv .field.unconfirmed .seg button.on { background: rgba(245,158,11,.35); }
  .conv input[type=text], .conv select { background: var(--panel-2); color: var(--text); border: 1px solid var(--border);
    border-radius: 5px; padding: 5px 8px; font-size: 12px; font-family: inherit; }
  .conv input[type=text]:focus, .conv select:focus { outline: none; border-color: var(--accent); }
  .conv .row { display: flex; gap: 6px; align-items: center; }
  .conv .row input[type=text] { flex: 1; min-width: 0; }
  .conv .confirm { background: var(--panel-2); color: var(--accent); border: 1px solid var(--accent); border-radius: 5px;
    padding: 4px 8px; font-size: 11px; cursor: pointer; white-space: nowrap; }
  .conv .field:not(.unconfirmed) .confirm { display: none; }
  .conv .speaker-note { font-size: 11px; color: var(--muted); margin-top: 3px; }
  .conv .speaker-note:empty { display: none; }
  .conv .checks { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 12px; }
  .conv .checks label { display: inline-flex; align-items: center; gap: 5px; cursor: pointer; }
  .conv .exclu { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; font-size: 12px; padding-top: 8px; border-top: 1px solid var(--border); margin-top: 2px; }
  .conv .exclu label { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; font-weight: 600; }
  .conv.is-excluded .field:not(.keep) { opacity: .4; pointer-events: none; }
  .conv-errors { color: #ef4444; font-size: 12px; margin-top: 10px; white-space: pre-line; }
  .conv-errors:empty { display: none; }
  .actions .save.excl { background: var(--muted); border-color: var(--muted); }

  .assignbar { padding: 8px 16px; border-bottom: 1px solid var(--border); display: flex; gap: 8px; align-items: center;
    font-size: 12px; color: var(--muted); flex-wrap: wrap; }
  .assignbar select { flex: 1; background: var(--panel-2); color: var(--text); border: 1px solid var(--border);
    border-radius: 6px; padding: 5px 8px; font-size: 12px; }
  .assignbar button, .empty .take { background: var(--accent); border: 1px solid var(--accent); color: #fff;
    border-radius: 6px; padding: 6px 12px; font-size: 12px; cursor: pointer; }
  .assignbar .note { width: 100%; font-size: 11px; }
  .task-item .assignee { margin-left: auto; margin-right: 8px; font-size: 10px; color: var(--muted); max-width: 120px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .task-item .assignee.none { font-style: italic; opacity: .7; }
  .task-item .loopmark + .assignee { margin-left: 0; }
  .loopmark { margin-left: auto; margin-right: 8px; font-size: 10px; font-weight: 600; color: #f97316;
    border: 1px solid rgba(249,115,22,.45); border-radius: 8px; padding: 0 6px; }
  .loop-alert { font-size: 12px; line-height: 1.5; color: var(--text); background: rgba(249,115,22,.08);
    border: 1px solid rgba(249,115,22,.45); border-radius: 8px; padding: 8px 12px; margin-bottom: 12px; }
  .loop-alert a { color: var(--accent); }
  .linkbtn { background: none; border: none; color: var(--accent); cursor: pointer; font-size: 12px; padding: 0 0 0 6px; text-decoration: underline; }

  /* Tag bar and live checks */
  .tagbar { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; margin-bottom: 6px; }
  .tagbar button { background: var(--panel-2); color: var(--text); border: 1px solid var(--border); border-radius: 5px;
    padding: 3px 8px; font-size: 12px; font-family: ui-monospace, monospace; cursor: pointer; }
  .tagbar button:hover { border-color: var(--accent); }
  .tagbar button kbd { font-size: 9px; color: var(--muted); margin-left: 4px; font-family: inherit; }
  .tagbar .sep { width: 1px; height: 18px; background: var(--border); margin: 0 4px; }
  .live { margin-top: 8px; display: flex; flex-direction: column; gap: 4px; }
  .live:empty { display: none; }
  .live .item { display: flex; align-items: flex-start; gap: 8px; font-size: 12px; line-height: 1.45;
    padding: 5px 9px; border-radius: 6px; border: 1px solid; }
  .live .item.err { color: #ef4444; border-color: rgba(239,68,68,.35); background: rgba(239,68,68,.06); }
  .live .item.warn { color: var(--pending); border-color: rgba(234,179,8,.35); background: rgba(234,179,8,.06); }
  .live .item .kind { font-weight: 700; font-size: 10px; text-transform: uppercase; letter-spacing: .04em; padding-top: 2px; white-space: nowrap; }
  .live .item .msg { flex: 1; color: var(--text); }
  .live .item .msg a { color: var(--accent); }
  .live .item button { background: var(--panel-2); color: var(--text); border: 1px solid var(--border); border-radius: 5px;
    padding: 2px 8px; font-size: 11px; cursor: pointer; white-space: nowrap; }
  .live .item button:hover { border-color: var(--accent); }
  .task-item .preview { color: var(--muted); margin-top: 4px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .main { display: flex; flex-direction: column; min-width: 0; }
  .toolbar { padding: 10px 20px; border-bottom: 1px solid var(--border); display: flex; gap: 10px;
    align-items: center; background: var(--panel); }
  .toolbar .spacer { flex: 1; }
  .toolbar button, .toolbar a.btn { background: var(--panel-2); color: var(--text); border: 1px solid var(--border);
    border-radius: 6px; padding: 6px 12px; font-size: 12px; cursor: pointer; text-decoration: none; }
  .toolbar button.primary { background: var(--accent); border-color: var(--accent); color: white; }
  .toolbar button:hover { border-color: var(--accent); }
  .toolbar .meta { font-size: 12px; color: var(--muted); }
  .toolbar-dashboard { background: var(--panel-2); color: var(--text); border: 1px solid var(--border);
    border-radius: 6px; padding: 6px 12px; font-size: 12px; text-decoration: none; }
  .toolbar-dashboard:hover { border-color: var(--accent); color: var(--accent); }
  .toggle-switch { display: inline-flex; align-items: center; gap: 7px; cursor: pointer; user-select: none; }
  .toggle-switch input { display: none; }
  .toggle-track { width: 32px; height: 18px; background: var(--muted); border-radius: 9px;
    position: relative; transition: background .2s; flex-shrink: 0; }
  .toggle-switch input:checked ~ .toggle-track { background: var(--accent); }
  .toggle-thumb { position: absolute; top: 2px; left: 2px; width: 14px; height: 14px;
    background: #fff; border-radius: 50%; transition: left .2s; }
  .toggle-switch input:checked ~ .toggle-track .toggle-thumb { left: 16px; }
  .toggle-thumb { display: flex; align-items: center; justify-content: center; font-size: 10px; line-height: 1; }
  .theme-thumb { background: none; font-size: 11px; }
  .toggle-label { font-size: 12px; color: var(--muted); }
  .overflow-menu { position: relative; }
  .overflow-btn { font-size: 18px !important; line-height: 1; padding: 2px 10px !important; letter-spacing: 2px; }
  .overflow-dropdown { position: absolute; top: 100%; right: 0; margin-top: 4px;
    background: var(--panel); border: 1px solid var(--border); border-radius: 8px;
    min-width: 180px; display: none; z-index: 100; overflow: hidden; }
  .overflow-dropdown.open { display: block; }
  .overflow-dropdown button, .dropdown-link { display: block; width: 100%; background: none; border: none;
    color: var(--text); padding: 10px 14px; font-size: 13px; text-align: left; cursor: pointer;
    text-decoration: none; }
  .overflow-dropdown button:hover, .dropdown-link:hover { background: var(--panel-2); }
  .overflow-dropdown button + button, .dropdown-link + button, .dropdown-link + .dropdown-link { border-top: 1px solid var(--border); }
  .lang-toggles { padding: 8px 12px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 10px; }
  .lang-label { font-size: 11px; color: var(--muted); flex: 1; }
  .lang-check { font-size: 12px; display: flex; align-items: center; gap: 4px; cursor: pointer; white-space: nowrap; }

  .content { flex: 1; padding: 24px 32px; overflow-y: auto; }
  .meta-row { display: flex; gap: 18px; font-size: 12px; color: var(--muted); margin-bottom: 14px; flex-wrap: wrap; }
  .meta-row b { color: var(--text); font-weight: 500; }

  .waveform-wrap { background: var(--panel); border: 1px solid var(--border); border-radius: 8px;
    padding: 12px; margin-bottom: 12px; }
  #waveform { width: 100%; min-height: 96px; cursor: crosshair; }
  .player-controls { display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
    margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--border); }
  .player-controls button { background: var(--panel-2); color: var(--text); border: 1px solid var(--border);
    border-radius: 6px; padding: 5px 10px; font-size: 12px; cursor: pointer; }
  .player-controls button:hover { border-color: var(--accent); }
  .player-controls button.active { background: var(--accent); border-color: var(--accent); color: white; }
  .player-controls .time { font-variant-numeric: tabular-nums; font-size: 12px; color: var(--muted); }
  .player-controls .sep { width: 1px; height: 18px; background: var(--border); }

  .rates { display: flex; gap: 4px; margin-left: auto; align-items: center; font-size: 12px; color: var(--muted); }
  .rates button { background: var(--panel-2); color: var(--text); border: 1px solid var(--border);
    border-radius: 4px; padding: 3px 8px; font-size: 11px; cursor: pointer; }
  .rates button.active { background: var(--accent); border-color: var(--accent); color: white; }

  .label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em;
    margin-bottom: 6px; margin-top: 14px; display: flex; justify-content: space-between; }
  .predictions-row { display: flex; gap: 10px; margin-bottom: 6px; flex-wrap: wrap; }
  .prediction { background: var(--panel); border: 1px solid var(--border); border-radius: 8px;
    padding: 12px 14px; font-size: 14px; line-height: 1.5; color: var(--muted);
    font-style: italic; user-select: text; flex: 1; min-width: 180px;
    overflow-wrap: break-word; word-break: break-word; }
  .prediction .pred-header { display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 8px; font-style: normal; }
  .prediction .pred-model { font-size: 11px; font-weight: 600; color: var(--text);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 70%; }
  .prediction .pred-score { font-size: 11px; color: var(--muted); }
  .prediction .pred-copy { background: transparent; border: none; color: var(--accent);
    cursor: pointer; font-size: 11px; padding: 0; font-style: normal; }
  .pred-word { cursor: pointer; border-radius: 3px; padding: 1px 0; }
  .pred-word:hover { background: rgba(79,140,255,0.25); color: var(--text); }
  textarea { width: 100%; min-height: 140px; background: var(--panel); color: var(--text);
    border: 1px solid var(--border); border-radius: 8px; padding: 14px; font-size: 16px;
    line-height: 1.5; font-family: inherit; resize: vertical; }
  textarea:focus { outline: none; border-color: var(--accent); }
  #annotationWrap { position: relative; }
  #suggestionBox { position: fixed; background: var(--panel-2);
    border: 1px solid var(--accent); border-radius: 6px; z-index: 1000; max-height: 180px;
    overflow-y: auto; box-shadow: 0 4px 12px rgba(0,0,0,.35); display: none; min-width: 140px; }
  .suggestion-item { padding: 7px 12px; cursor: pointer; font-size: 14px; white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis; }
  .suggestion-item:hover, .suggestion-item.active { background: var(--accent); color: #fff; }
  #taMirror { position: absolute; visibility: hidden; pointer-events: none; white-space: pre-wrap;
    word-wrap: break-word; overflow: hidden; top: 0; left: 0; }

  .actions { display: flex; gap: 10px; margin-top: 16px; align-items: center; }
  .actions .save { background: var(--accent); border-color: var(--accent); color: white; }
  .actions button { padding: 9px 18px; font-size: 13px; border-radius: 6px; cursor: pointer;
    border: 1px solid var(--border); color: var(--text); background: var(--panel-2); }
  .actions .status { margin-left: auto; font-size: 12px; color: var(--muted); }
  .actions .status.saved { color: var(--done); }
  .actions .status.autosaved { color: #90D6FF; }

  .hints { margin-top: 28px; font-size: 11px; color: var(--muted); border-top: 1px solid var(--border); padding-top: 14px; }
  .hints kbd { background: var(--panel-2); border: 1px solid var(--border); border-radius: 3px;
    padding: 1px 6px; font-size: 10px; font-family: ui-monospace, monospace; }
  .empty { padding: 60px; text-align: center; color: var(--muted); }
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <header>
      <div style="display: flex; align-items: center;">
        <img src="/static/logo.png" alt="Logo" class="logo" style="height: 40px; margin-right: 10px;">
      </div>
    </header>
    <div class="project-picker">
      <label>Project</label>
      <select id="projectSelect"></select>
    </div>
    <div class="progress">
      <div><span id="progressText">0 / 0 done</span></div>
      <div class="progress-bar"><div id="progressFill" style="width:0"></div></div>
    </div>
    <div class="filter">
      <button data-filter="all" class="active">All</button>
      <button data-filter="pending">Pending</button>
      <button data-filter="done">Done</button>
      <button data-filter="review">Review <span id="reviewCount"></span></button>
      <button data-filter="excluded">Exclus</button>
      <button data-filter="loops" title="Brouillons qui ressemblent à une boucle Whisper, pas encore validés : à relire en priorité (règle 7.4)">↻ <span id="loopCount"></span></button>
    </div>
    <div class="assignbar" id="assignBar" hidden></div>
    <div id="taskList" class="task-list"></div>
  </aside>

  <main class="main">
    <div class="toolbar">
      <a class="toolbar-dashboard" href="/">Dashboard</a>
      <a class="toolbar-dashboard" href="/admin" id="adminLink" hidden>Admin</a>
      <span class="meta" id="metaIdx">—</span>
      <div class="spacer"></div>
      <a class="toolbar-dashboard" href="/account" id="who" title="My account · change password" hidden></a>
      <form method="post" action="/logout" id="logoutForm" style="margin:0" hidden><button>Log out</button></form>
      <label class="toggle-switch" title="Toggle theme">
        <input type="checkbox" id="themeBtn">
        <span class="toggle-track theme-track"><span class="toggle-thumb theme-thumb" id="themeIcon">🌙</span></span>
      </label>
      <div id="nasActions"></div>
      <div class="overflow-menu">
        <button class="btn overflow-btn" id="overflowBtn" title="More actions">⋯</button>
        <div class="overflow-dropdown" id="overflowDropdown">
          <div class="lang-toggles">
            <span class="lang-label">Suggestions</span>
            <label class="lang-check"><input type="checkbox" id="langMG"> MG</label>
            <label class="lang-check"><input type="checkbox" id="langFR"> FR</label>
            <label class="lang-check"><input type="checkbox" id="langEN"> EN</label>
          </div>
        </div>
      </div>
    </div>
    <div class="content" id="content">
      <div class="empty">Loading…</div>
    </div>
  </main>
</div>

<script type="module">
import WaveSurfer from "{{ url_for('static', filename='wavesurfer/wavesurfer.esm.js') }}";
import RegionsPlugin from "{{ url_for('static', filename='wavesurfer/plugins/regions.esm.js') }}";

// Back to the login page when the session has ended (signed out, password changed, account removed).
const _fetch = window.fetch;
window.fetch = async (...args) => {
  const r = await _fetch(...args);
  if (r.status === 401) location.href = "/login?next=" + encodeURIComponent(location.pathname);
  return r;
};
const meReady = fetch("/api/me").then(r => r.json()).then(me => {
  state.role = me.role;
  state.user = me.user;
  if (me.role === "admin") document.getElementById("adminLink").hidden = false;
  if (me.user) {
    document.getElementById("who").textContent = "👤 " + me.user;
    document.getElementById("who").hidden = false;
    document.getElementById("logoutForm").hidden = false;
  }
}).catch(() => {});

// Central application state shared across all functions.
const state = {
  projects: [],
  project: null,
  tasks: [],
  current: null,
  filter: "all",
  ws: null,
  regions: null,
  loopRegion: null,
  loop: true,
  rate: 1,
  autoplay: localStorage.getItem("labelin.autoplay") !== "false",
  saveTimer: null,
  wordLists: { mg: [], fr: [], en: [] },
  learnedWords: [],
  activeLangs: JSON.parse(localStorage.getItem("labelin.langs") || '["mg"]'),
};

// Preload per-language word lists and previously learned words for autocomplete.
const WORD_FILES = { mg: "/static/mg_words.json", fr: "/static/fr_words.json", en: "/static/en_words.json" };
Object.entries(WORD_FILES).forEach(([lang, url]) => {
  fetch(url).then(r => r.json()).then(words => { state.wordLists[lang] = words; }).catch(() => {});
});
fetch("/api/learned-words").then(r => r.json()).then(words => { state.learnedWords = words; }).catch(() => {});

// Syncs the language-filter checkboxes with state and persists changes to localStorage.
function initLangToggles() {
  ["mg","fr","en"].forEach(lang => {
    const el = document.getElementById("lang" + lang.toUpperCase());
    if (!el) return;
    el.checked = state.activeLangs.includes(lang);
    el.onchange = () => {
      if (el.checked) { if (!state.activeLangs.includes(lang)) state.activeLangs.push(lang); }
      else { state.activeLangs = state.activeLangs.filter(l => l !== lang); }
      localStorage.setItem("labelin.langs", JSON.stringify(state.activeLangs));
    };
  });
}

const STORAGE_KEY = "labelin.lastProject";

// Cursor position saved from the annotation textarea before it loses focus.
let savedCursor = 0;

// Keeps savedCursor in sync with the annotation textarea's caret position.
function trackCursor(ta) {
  const save = () => { savedCursor = ta.selectionStart; };
  ta.addEventListener("keyup", save);
  ta.addEventListener("click", save);
  ta.addEventListener("mouseup", save);
  ta.addEventListener("blur", save);
}

// Replaces the word under the saved cursor position with the clicked prediction word.
function insertPredictionText(word) {
  const ta = document.getElementById("annotation");
  if (!ta) return;
  const text = ta.value;
  const pos = savedCursor;
  let start = pos;
  let end = pos;
  // Expand outward to word boundaries (non-whitespace chars).
  while (start > 0 && /\S/.test(text[start - 1])) start--;
  while (end < text.length && /\S/.test(text[end])) end++;
  const newText = text.slice(0, start) + word + text.slice(end);
  ta.value = newText;
  const newPos = start + word.length;
  ta.focus();
  ta.setSelectionRange(newPos, newPos);
  savedCursor = newPos;
}

// Makes each word in the predictions panel individually clickable for insertion into the annotation.
function setupPredictionWords(container) {
  if (!container) return;
  container.querySelectorAll(".pred-body").forEach(predEl => {
    const raw = predEl.dataset.raw || "";
    if (!raw) return;
    const tokens = raw.split(/(\s+)/);
    predEl.innerHTML = tokens.map(tok => {
      if (/^\s+$/.test(tok)) return escapeHtml(tok);
      return `<span class="pred-word" data-word="${escapeHtml(tok)}">${escapeHtml(tok)}</span>`;
    }).join("");

    let pendingSelection = null;

    predEl.addEventListener("mousedown", () => { pendingSelection = null; });
    predEl.addEventListener("mouseup", () => {
      const sel = window.getSelection();
      if (sel && sel.toString().trim()) pendingSelection = sel.toString().trim();
    });
    predEl.querySelectorAll(".pred-word").forEach(span => {
      span.addEventListener("mousedown", e => e.preventDefault());
      span.addEventListener("click", () => {
        const word = pendingSelection || span.dataset.word;
        pendingSelection = null;
        insertPredictionText(word);
      });
    });
  });
}

// Loads all available projects from the API and populates the project selector.
async function fetchProjects() {
  await meReady;
  const r = await fetch("/api/projects");
  const j = await r.json();
  state.projects = j.projects;
  const sel = document.getElementById("projectSelect");
  if (!state.projects.length && state.user && state.role !== "admin") return showNothingAssigned();
  if (!state.projects.length) {
    document.getElementById("content").innerHTML =
      `<div class="empty">No projects found in <code>${j.root}</code>.<br>
       Each project must be a subfolder containing a <code>*.label_studio.json</code>.</div>`;
    sel.innerHTML = "<option>(none)</option>";
    return;
  }
  sel.innerHTML = state.projects.map(p => {
    const pct = p.total ? (p.done / p.total) * 100 : 0;
    return `<option value="${p.name}">${p.name}  —  ${p.done}/${p.total} (${pct.toFixed(0)}%)</option>`;
  }).join("");
  const last = localStorage.getItem(STORAGE_KEY);
  const initial = state.projects.find(p => p.name === last)?.name || state.projects[0].name;
  sel.value = initial;
  await switchProject(initial);
  sel.onchange = () => switchProject(sel.value);
}

// Activates a project by name, persisting the choice and reloading its tasks.
async function switchProject(name) {
  state.project = name;
  localStorage.setItem(STORAGE_KEY, name);
  renderNasButtons(name);
  await fetchTasks();
}

// Shows Backup/Sync NAS action buttons based on the current project's sync status.
async function renderNasButtons(name) {
  const container = document.getElementById("nasActions");
  try {
    const r = await fetch("/api/sync-status");
    const j = await r.json();
    const status = j.projects?.[name];
    if (!j.nas_accessible || !status) {
      container.innerHTML = "";
      return;
    }
    let html = "";
    if (!status.on_nas || status.local_ahead) {
      html += `<button data-nas="backup">Backup to NAS</button>`;
    }
    if (status.nas_ahead) {
      html += `<button data-nas="sync">Sync from NAS</button>`;
    }
    container.innerHTML = html;
    container._nasProject = name;
  } catch (e) {
    container.innerHTML = "";
  }
}

// Pushes the current project's data to the NAS and reflects the result in the UI.
async function doBackup(name) {
  const container = document.getElementById("nasActions");
  container.innerHTML = "<button disabled>Backing up\u2026</button>";
  try {
    const r = await fetch(`/api/projects/${encodeURIComponent(name)}/backup`, { method: "POST" });
    const j = await r.json();
    container.innerHTML = j.ok
      ? '<button disabled style="color:var(--done)">\u2713 Backed up</button>'
      : '<button disabled style="color:#ef4444">\u2717 Failed</button>';
    if (!j.ok) console.error(j.error);
  } catch (e) {
    container.innerHTML = '<button disabled style="color:#ef4444">\u2717 Error</button>';
    console.error(e);
  } finally {
    setTimeout(() => renderNasButtons(name), 2500);
  }
}

// Pulls the latest tasks from the NAS into the current project, then refreshes the task list.
async function doSync(name) {
  const container = document.getElementById("nasActions");
  container.innerHTML = "<button disabled>Syncing\u2026</button>";
  try {
    const r = await fetch(`/api/projects/${encodeURIComponent(name)}/sync`, { method: "POST" });
    const j = await r.json();
    if (!r.ok) {
      container.innerHTML = `<button disabled style="color:#ef4444">\u2717 ${j.error}</button>`;
    } else if (j.action === "skipped") {
      container.innerHTML = '<button disabled style="color:var(--done)">\u2713 Already up to date</button>';
    } else {
      container.innerHTML = `<button disabled style="color:var(--done)">\u2713 Pulled ${j.pulled} task${j.pulled !== 1 ? "s" : ""}</button>`;
      await fetchTasks();
    }
  } catch (e) {
    container.innerHTML = '<button disabled style="color:#ef4444">\u2717 Error</button>';
    console.error(e);
  } finally {
    setTimeout(() => renderNasButtons(name), 3000);
  }
}

// state.tasks holds the segments this account can see (all of them for admins, the assigned
// ones otherwise), so a segment's number (t.index) is not its position: look it up with taskAt.
function setTasks(tasks) {
  state.tasks = tasks;
  state.byIndex = new Map(tasks.map(t => [t.index, t]));
}
function taskAt(idx) { return state.byIndex?.get(idx); }

// Admins: "Assigné à" filter over every segment. Others: their segments, plus "take 50 more".
async function renderAssignBar() {
  const bar = document.getElementById("assignBar");
  if (!bar || !state.user) return;
  bar.hidden = false;
  if (state.role === "admin") {
    if (!state.accounts) {
      try { state.accounts = (await fetch("/api/admin/users").then(r => r.json())).users.map(u => u.name); }
      catch (e) { state.accounts = []; }
    }
    const names = [...new Set([...state.accounts, ...state.tasks.flatMap(t => t.assignees || [])])].sort();
    const count = f => state.tasks.filter(t => f === "__none__" ? !(t.assignees || []).length : (t.assignees || []).includes(f)).length;
    bar.innerHTML = `<span>Assigné à</span>
      <select id="assignFilter">
        <option value="">Tous (${state.tasks.length})</option>
        <option value="__none__">Non assignés (${count("__none__")})</option>
        ${names.map(n => `<option value="${escapeHtml(n)}">${escapeHtml(n)} (${count(n)})</option>`).join("")}
      </select>`;

    sel.value = state.assignFilter || "";

  } else {

    bar.innerHTML = `<button type="button" id="takeBtn">＋ Prendre 50 segments</button>
      <span>${todo} à faire dans votre lot</span>`;

async function takeMore(project) {
  const r = await fetch(`/api/projects/${encodeURIComponent(project)}/take`, {
    method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ count: 50 }),
  });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) { alert(j.error || `Impossible de prendre des segments (HTTP ${r.status}).`); return; }
  if (project !== state.project || !state.tasks.length) { localStorage.setItem(STORAGE_KEY, project); return fetchProjects(); }
  await reloadTasks(j.first);
}

// Fetches all tasks for the active project and opens the first pending task.
async function fetchTasks() {
  const r = await fetch(`/api/projects/${encodeURIComponent(state.project)}/tasks`);
  const j = await r.json();
  setTasks(j.tasks || []);
  state.current = null;
  try {
    state.conv = await fetch(`/api/projects/${encodeURIComponent(state.project)}/convention`).then(r => r.json());
  } catch (e) { state.conv = null; }
  renderSidebar();
  renderAssignBar();

    const firstPending = state.tasks.find(t => t.status !== "done" && t.status !== "excluded");

// Rebuilds the task list, progress bar, and project dropdown label to reflect current state.
function renderSidebar() {
  const list = document.getElementById("taskList");
  const filtered = getFilteredTasks();
  list.innerHTML = filtered.map(t => `
    <div class="task-item ${t.index === state.current ? "active" : ""}" data-idx="${t.index}">
      <div class="row1">
        <span class="idx">#${String(t.index).padStart(4,"0")}</span>
        ${isLoopToReview(t) ? `<span class="loopmark" title="Boucle probable : ${escapeHtml(t.loop.reasons.join(" ; "))}">↻ boucle</span>` : ""}
        ${state.role === "admin" ? `<span class="assignee ${(t.assignees || []).length ? "" : "none"}">${escapeHtml((t.assignees || []).join(", ") || "non assigné")}</span>` : ""}
        <span class="badge ${t.status}"></span>
      </div>
      <div class="preview">${escapeHtml(t.annotation || t.prediction || "(no text)")}</div>
    </div>

  const excluded = state.tasks.filter(t => t.status === "excluded").length;
  // Excluded segments are finished work too.
  const pct = state.tasks.length ? ((done + excluded) / state.tasks.length) * 100 : 0;
  document.getElementById("progressText").textContent =
    `${done} / ${state.tasks.length} done` + (excluded ? ` · ${excluded} exclus` : "") + `  ·  ${pct.toFixed(1)}%`;
  document.getElementById("progressFill").style.width = pct + "%";
  const sel = document.getElementById("projectSelect");
  const opt = sel.querySelector(`option[value="${CSS.escape(state.project)}"]`);
  if (opt) opt.textContent = `${state.project}  —  ${done + excluded}/${state.tasks.length} (${pct.toFixed(0)}%)`;
  const reviewCount = state.tasks.filter(t => t.status === "review" || t.status === "autosave").length;
  const rc = document.getElementById("reviewCount");
  if (rc) rc.textContent = reviewCount ? `(${reviewCount})` : "";
  const lc = document.getElementById("loopCount");
  if (lc) lc.textContent = state.tasks.filter(isLoopToReview).length;
}

// Destroys the current WaveSurfer instance and clears all related state.
function teardownWavesurfer() {
  if (state.ws) {
    try { state.ws.destroy(); } catch (e) { /* ignore */ }
  }
  state.ws = null;
  state.regions = null;
  state.loopRegion = null;
}

// Formats a duration in seconds as M:SS.ss for display in the player.
function fmtTime(s) {
  if (!isFinite(s)) return "—";
  const m = Math.floor(s / 60);
  const sec = (s - m * 60).toFixed(2).padStart(5, "0");
  return `${m}:${sec}`;
}

// Refreshes the time display with current playhead position and active loop bounds.
function updateTimeDisplay() {
  const el = document.getElementById("timeDisplay");
  if (!el || !state.ws) return;
  const cur = state.ws.getCurrentTime();
  const dur = state.ws.getDuration();
  let label = `${fmtTime(cur)} / ${fmtTime(dur)}`;
  if (state.loopRegion) {
    label += `  ·  loop ${fmtTime(state.loopRegion.start)}–${fmtTime(state.loopRegion.end)}`;
  } else if (state.loop) {
    label += `  ·  loop full clip`;
  }
  el.textContent = label;
}

// Creates a new loop region on the waveform or moves the existing one to new bounds.
function setOrUpdateLoopRegion(start, end) {
  if (!state.regions) return;
  if (state.loopRegion) {
    state.loopRegion.setOptions({ start, end });
  } else {
    const region = state.regions.addRegion({
      start, end,
      color: "rgba(79, 140, 255, 0.18)",
      drag: true,
      resize: true,
    });
    state.loopRegion = region;
  }
  updateTimeDisplay();
  updateLoopButtonStates();
}

// Removes the loop region from the waveform and resets related UI state.
function clearLoop() {
  if (state.loopRegion) {
    try { state.loopRegion.remove(); } catch (e) { /* ignore */ }
    state.loopRegion = null;
  }
  updateTimeDisplay();
  updateLoopButtonStates();
}

// Reflects the current loop-on/off state in the Loop button's appearance.
function updateLoopButtonStates() {
  const loopBtn = document.getElementById("loopBtn");
  if (loopBtn) loopBtn.classList.toggle("active", state.loop);
  // Also refresh the time display so the "loop full clip" hint appears/disappears.
  updateTimeDisplay();
}

// Initialises WaveSurfer with the regions plugin and wires up all playback/loop event handlers.
function initWavesurfer(audioUrl) {
  teardownWavesurfer();
  const ws = WaveSurfer.create({
    container: "#waveform",
    waveColor: "#4f8cff",
    progressColor: "#2dd4bf",
    cursorColor: "#e6e8ee",
    cursorWidth: 1,
    barWidth: 2,
    barGap: 1,
    barRadius: 1,
    height: 96,
    normalize: true,
    url: audioUrl,
  });
  state.ws = ws;

  const regions = ws.registerPlugin(RegionsPlugin.create());
  state.regions = regions;

  // Drag on the empty waveform to create / replace the loop region.
  regions.enableDragSelection({ color: "rgba(79, 140, 255, 0.18)" });

  regions.on("region-created", (region) => {
    // Only one loop region at a time.
    regions.getRegions().forEach(r => { if (r !== region) r.remove(); });
    state.loopRegion = region;
    updateTimeDisplay();
    updateLoopButtonStates();
  });
  regions.on("region-updated", (region) => {
    state.loopRegion = region;
    updateTimeDisplay();
  });
  regions.on("region-removed", (region) => {
    if (state.loopRegion === region) state.loopRegion = null;
    updateLoopButtonStates();
  });

  ws.on("ready", () => {
    ws.setPlaybackRate(state.rate, true);
    updateTimeDisplay();
  });
  ws.on("audioprocess", () => {
    updateTimeDisplay();
    if (state.loop && state.loopRegion) {
      const t = ws.getCurrentTime();
      if (t >= state.loopRegion.end - 0.01) {
        ws.setTime(state.loopRegion.start);
      }
    }
  });
  ws.on("interaction", () => updateTimeDisplay());
  ws.on("finish", () => {
    if (!state.loop) return;
    const start = state.loopRegion ? state.loopRegion.start : 0;
    ws.setTime(start);
    ws.play();
  });
}

    b.onclick = () => {
      state.rate = parseFloat(b.dataset.rate);
      state.ws?.setPlaybackRate(state.rate, true);
      document.querySelectorAll(".rates button").forEach(x => x.classList.toggle("active", x === b));
    };
  });
  document.querySelectorAll(".pred-copy").forEach(btn => {
    btn.addEventListener("mousedown", e => e.preventDefault());
    btn.onclick = () => {
      const pi = parseInt(btn.dataset.predIndex);
      const pred = (t.predictions && t.predictions[pi]) || {text: t.prediction || ""};
      ta.value = pred.text || "";
      ta.focus();
      savedCursor = ta.value.length;
      ta.setSelectionRange(savedCursor, savedCursor);
    };
  });
  document.getElementById("saveBtn").onclick = () => save(true);
  document.getElementById("skipBtn").onclick = () => goto(getNextFilteredIndex(idx));
  document.getElementById("markPending").onclick = () => save(false, "pending");
  document.getElementById("markReview").onclick = () => save(false, "review");
  wireConventionPanel();
  const splitBtn = document.getElementById("splitBtn");
  if (splitBtn) splitBtn.onclick = () => splitSegment(idx);
  const unsplitBtn = document.getElementById("unsplitBtn");
  if (unsplitBtn) unsplitBtn.onclick = () => unsplitSegment(idx);

  // Trigger autocomplete and schedule an autosave on every keystroke.
  ta.addEventListener("input", () => {
    normalizeHesitations(ta);
    if (syncSpeakers()) refreshConventionPanel();
    scheduleLiveCheck();
    clearTimeout(state.saveTimer);
    state.saveTimer = setTimeout(() => autoSave(), 1500);
    updateSuggestions();
  });

  // Handle arrow-key navigation and Enter/Tab/Escape inside the autocomplete suggestion box.
  ta.addEventListener("keydown", (e) => {
    const box = document.getElementById("suggestionBox");
    if (!box || box.style.display === "none") return;
    const items = box.querySelectorAll(".suggestion-item");
    let active = box.querySelector(".suggestion-item.active");
    if (e.key === "ArrowDown") {
      e.preventDefault();
      const next = active ? (active.nextElementSibling || items[0]) : items[0];
      active?.classList.remove("active");
      next?.classList.add("active");
    } else if (e.key === "ArrowUp") {
      e.preventDefault();
      const prev = active ? (active.previousElementSibling || items[items.length - 1]) : items[items.length - 1];
      active?.classList.remove("active");
      prev?.classList.add("active");
    } else if (e.key === "Tab" || e.key === "Enter") {
      if (active) {
        e.preventDefault();
        applySuggestion(active.dataset.word);
      }
    } else if (e.key === "Escape") {
      closeSuggestions();
    }
  });

  ta.addEventListener("blur", () => {
    setTimeout(closeSuggestions, 150);
  });

  // Close autocomplete suggestions when the cursor moves without selecting a word.
  let _lastCursorPos = -1;
  ta.addEventListener("keyup", (e) => {
    if (["ArrowLeft","ArrowRight","ArrowUp","ArrowDown","Home","End"].includes(e.key)) {
      if (ta.selectionStart !== _lastCursorPos) closeSuggestions();
    }
    _lastCursorPos = ta.selectionStart;
  });
  ta.addEventListener("click", () => {
    if (ta.selectionStart !== _lastCursorPos) closeSuggestions();
    _lastCursorPos = ta.selectionStart;
  });

  if (state.ws) {
    state.ws.on("play", () => { document.getElementById("playBtn").textContent = "⏸ Pause"; });
    state.ws.on("pause", () => { document.getElementById("playBtn").textContent = "▶ Play"; });
  }

  renderSidebar();
  scrollSidebarToCurrent();
}

// Pins the loop region's start boundary to the current playhead position.
function setLoopStartAtPlayhead() {
  if (!state.ws) return;
  const t = state.ws.getCurrentTime();
  const dur = state.ws.getDuration();
  if (state.loopRegion) {
    const end = Math.max(t + 0.05, state.loopRegion.end);
    setOrUpdateLoopRegion(t, end);
  } else {
    setOrUpdateLoopRegion(t, Math.min(dur, t + 1));
  }
}

// Pins the loop region's end boundary to the current playhead position.
function setLoopEndAtPlayhead() {
  if (!state.ws) return;
  const t = state.ws.getCurrentTime();
  if (state.loopRegion) {
    const start = Math.min(t - 0.05, state.loopRegion.start);
    setOrUpdateLoopRegion(Math.max(0, start), t);
  } else {
    setOrUpdateLoopRegion(Math.max(0, t - 1), t);
  }
}

// Scrolls the sidebar so the active task item is visible.
function scrollSidebarToCurrent() {
  const el = document.querySelector(".task-item.active");
  if (el) el.scrollIntoView({ block: "nearest" });
}

// Words of a transcription as autocomplete entries, like vocab_words() on the server: tags,
// false starts (mand-), digits and curly quotes are skipped; inner - and ' are kept (an-tsena).
function vocabWords(text) {
  const out = [];
  for (const tok of (text || "").replace(/\[[^\]]*\]/g, " ").split(/[\s"«»“”.,!?;:()\[\]{}…–—\/]+/)) {
    if (/[\d’‘]/.test(tok)) continue;
    const w = tok.replace(/^'+|'+$/g, "").toLowerCase();
    if (w.length > 1 && !w.startsWith("-") && !w.endsWith("-")) out.push(w);
  }
  return out;
}

// Builds the deduplicated word pool for autocomplete: words of done segments (this project, then
// all projects from the server), then the language word lists. Drafts never feed it.
function getSuggestionWords() {
  const idx = state.current;
  const seen = new Set();
  const words = [];
  for (let i = 0; i < state.tasks.length; i++) {
    if (i === idx || state.tasks[i].status !== "done") continue;
    for (const w of vocabWords(state.tasks[i].annotation)) {
      if (!seen.has(w)) { seen.add(w); words.push(w); }
    }
  }
  for (const w of state.learnedWords) {
    if (!seen.has(w)) { seen.add(w); words.push(w); }
  }
  for (const lang of state.activeLangs) {
    for (const w of (state.wordLists[lang] || [])) {
      if (!seen.has(w)) { seen.add(w); words.push(w); }
    }
  }
  return words;
}

// Returns the screen pixel position of the textarea caret for positioning the suggestion dropdown.
function getCursorPixelPos(ta) {
  const mirror = document.getElementById("taMirror");
  if (!mirror) return { x: 0, y: 0 };
  const cs = getComputedStyle(ta);
  const props = ["font","fontSize","fontFamily","fontWeight","fontStyle","letterSpacing",
    "lineHeight","padding","paddingTop","paddingRight","paddingBottom","paddingLeft",
    "borderTopWidth","borderRightWidth","borderBottomWidth","borderLeftWidth","width","boxSizing"];
  props.forEach(p => mirror.style[p] = cs[p]);
  mirror.style.width = ta.offsetWidth + "px";
  mirror.style.height = ta.offsetHeight + "px";
  mirror.style.overflowY = "scroll";
  mirror.scrollTop = ta.scrollTop;

  const before = ta.value.slice(0, ta.selectionStart);
  mirror.innerHTML = escapeHtml(before) + '<span id="taCaret"> </span>';

  const caret = document.getElementById("taCaret");
  const mirrorRect = mirror.getBoundingClientRect();
  const caretRect = caret.getBoundingClientRect();
  return {
    x: caretRect.left,
    y: caretRect.bottom
  };
}

// Shows a contextual autocomplete dropdown for the word currently being typed.
function updateSuggestions() {
  const ta = document.getElementById("annotation");
  const box = document.getElementById("suggestionBox");
  if (!ta || !box) return;
  const pos = ta.selectionStart;
  const before = ta.value.slice(0, pos);
  const after = ta.value.slice(pos);
  const prefixMatch = before.match(/(\S+)$/);
  const suffixMatch = after.match(/^(\S+)/);
  if (!prefixMatch) { closeSuggestions(); return; }
  const wholeWord = (prefixMatch[1] + (suffixMatch ? suffixMatch[1] : "")).toLowerCase();
  if (wholeWord.length < 2) { closeSuggestions(); return; }
  const words = getSuggestionWords().filter(w => w.startsWith(wholeWord) && w !== wholeWord);
  if (!words.length) { closeSuggestions(); return; }
  box.innerHTML = words.slice(0, 8).map(w =>
    `<div class="suggestion-item" data-word="${escapeHtml(w)}">${escapeHtml(w)}</div>`
  ).join("");
  box.querySelectorAll(".suggestion-item").forEach(item => {
    item.addEventListener("mousedown", (e) => { e.preventDefault(); applySuggestion(item.dataset.word); });
  });
  box.style.display = "block";

  const { x, y } = getCursorPixelPos(ta);
  const vw = window.innerWidth, vh = window.innerHeight;
  const bw = box.offsetWidth || 160, bh = box.offsetHeight || 100;
  box.style.left = Math.min(x, vw - bw - 8) + "px";
  box.style.top = (y + bh + 8 > vh ? y - bh - 4 : y + 4) + "px";
}

// Replaces the partial word at the cursor with the chosen autocomplete suggestion.
function applySuggestion(word) {
  const ta = document.getElementById("annotation");
  if (!ta) return;
  const pos = ta.selectionStart;
  const before = ta.value.slice(0, pos);
  const after = ta.value.slice(pos);
  const newBefore = before.replace(/(\S+)$/, word);
  const afterTrimmed = after.replace(/^(\S+)/, "");
  ta.value = newBefore + afterTrimmed;
  const newPos = newBefore.length;
  ta.setSelectionRange(newPos, newPos);
  closeSuggestions();
  clearTimeout(state.saveTimer);
  state.saveTimer = setTimeout(() => autoSave(), 1500);
}

// Hides and clears the autocomplete suggestion dropdown.
function closeSuggestions() {
  const box = document.getElementById("suggestionBox");
  if (box) { box.style.display = "none"; box.innerHTML = ""; }
}

// Adds the words of a segment just marked done to this page's list. The server rebuilds its own
// list from done segments, so nothing is sent.
function learnWords(text) {
  const known = new Set(state.learnedWords);
  const newWords = vocabWords(text).filter(w => !known.has(w) && known.add(w));
  if (newWords.length) state.learnedWords = [...state.learnedWords, ...newWords];
}

// --- PROVA-MG convention: per-segment fields ----------------------------------------------
// state.meta holds the fields being edited. Fields missing on a segment are pre-filled from the
// closest earlier segment that has them; speaker, language and dialect pre-filled that way stay
// "à confirmer" (state.unconfirmed) until the transcriber picks or confirms them, since they can
// change from one segment to the next. Register and quality are taken as they are.
const FIELD_LABELS = { lang: "la langue", dialect: "le dialecte", register: "le registre",
  quality: "la qualité audio", speaker: "le locuteur" };
const CARRIED = ["lang", "dialect", "register", "quality", "speaker"];
const RECHECK = ["speaker", "lang", "dialect"];

function prepareMeta(t) {
  const own = t.meta || {};
  const meta = { ...own, flags: [...(own.flags || [])] };
  state.unconfirmed = new Set();
  for (let i = t.index - 1; i >= 0 && CARRIED.some(k => !meta[k]); i--) {
    const prev = taskAt(i)?.meta;
    if (!prev) continue;
    for (const k of CARRIED) {
      if (!meta[k] && prev[k]) {
        meta[k] = prev[k];
        // After a multi-speaker segment (S1+S2), the next one starts with whoever spoke last.
        if (k === "speaker" && prev[k].includes("+"))
          meta[k] = lastTagSpeaker(taskAt(i).annotation) || prev[k].split("+")[0];
        if (RECHECK.includes(k)) state.unconfirmed.add(k);
      }
    }
  }
  state.meta = meta;
  state.excluded = t.status === "excluded";
  const tags = speakerTags(t.annotation);
  state.tagSpeaker = tags.length >= 2 && meta.speaker === tags.join("+");
  state.speakerBeforeTags = null;
}

// Fields as they will be saved: values still "à confirmer" are left out.
function confirmedMeta() {
  const m = { ...state.meta, flags: [...state.meta.flags] };
  state.unconfirmed.forEach(k => delete m[k]);
  if (!state.excluded) delete m.exclude_reason;
  return m;
}

// Rule 6: every hesitation sound is written [euh]. Typing [ah], [hmm]… converts it on the spot.
const HESITATION_RE = /\[(ah|eh|euh|hmm?|mm+|em|ehm|euhm)\]/gi;
function normalizeHesitations(ta) {
  if (!state.conv || !HESITATION_RE.test(ta.value)) return;
  HESITATION_RE.lastIndex = 0;
  const before = ta.value.slice(0, ta.selectionStart).replace(HESITATION_RE, "[euh]");
  ta.value = before + ta.value.slice(ta.selectionStart).replace(HESITATION_RE, "[euh]");
  ta.setSelectionRange(before.length, before.length);
  savedCursor = before.length;
}

function conventionProblems(text) {
  const m = state.meta;
  if (state.excluded) return m.exclude_reason ? [] : ["Choisir la raison de l'exclusion."];
  const out = [];
  if (!text) out.push("La transcription est vide (ou exclure le segment).");
  const missing = Object.keys(FIELD_LABELS).filter(k => !m[k]);
  if (missing.length) out.push("Renseigner " + missing.map(k => FIELD_LABELS[k]).join(", ") + ".");
  const toConfirm = [...state.unconfirmed].filter(k => m[k]);
  const names = toConfirm.map(k => FIELD_LABELS[k]);
  if (names.length) out.push("Confirmer " + (names.length > 1 ? names.slice(0, -1).join(", ") + " et " : "")
    + names[names.length - 1] + " (repris du segment précédent : à juger sur ce segment).");
  if (m.speaker && !new RegExp(state.conv.speaker_pattern).test(m.speaker))
    out.push("Locuteur : S1, S2… ou S1+S2 pour une région à plusieurs locuteurs.");
  // The other rules (tags, digits, rule 8.5…) are checked by the server, which explains each one.
  return out;
}

// Speaker buttons: the speakers already used in the project (and the current value), then the
// next new one. Clicking the pre-filled speaker confirms it without retyping.
function speakerChoices(used, current) {
  const set = new Set([...(used || []), ...(current ? [current] : [])]);
  const nums = [...set].flatMap(s => (s.match(/\d+/g) || []).map(Number));
  set.add("S" + (nums.length ? Math.max(...nums) + 1 : 1));
  const order = s => s.split("+").map(p => parseInt(p.slice(1), 10) || 0);
  return [...set].sort((a, b) => {
    const x = order(a), y = order(b);
    return x.length - y.length || x.reduce((d, v, i) => d || v - y[i], 0);
  });
}

function conventionPanelHtml(t) {
  prepareMeta(t);
  const c = state.conv;
  if (!c) return "";
  const m = state.meta;
  const seg = (field, values) => `<div class="seg">${values.map(v =>
    `<button type="button" data-set="${field}" data-value="${escapeHtml(v)}" class="${m[field] === v ? "on" : ""}">${escapeHtml(v)}</button>`).join("")}</div>`;
  const field = (key, label, body, extra = "") =>
    `<div class="field ${state.unconfirmed.has(key) ? "unconfirmed" : ""} ${extra}" data-field="${key}">
       <div class="flabel">${label}<span class="todo">à confirmer</span></div>${body}</div>`;
  const stateLabel = t.convention ? `<span class="conv-state ok">validé ${escapeHtml(t.convention)}</span>`
    : t.annotation && (t.status === "done" || t.status === "review")
      ? `<span class="conv-state old">avant convention</span>` : "";
  return `
    <div class="conv ${state.excluded ? "is-excluded" : ""}" id="conv">
      <div class="conv-head"><span>Convention PROVA-MG <b>${escapeHtml(c.version)}</b></span>${stateLabel}
        <a href="/documentation" target="labelin-convention">Lire la convention ↗</a></div>
      <div class="conv-grid">
        ${field("lang", "Langue *", seg("lang", c.langs))}
        ${field("register", "Registre *", seg("register", c.registers))}
        ${field("quality", "Qualité audio *", seg("quality", c.qualities))}
        ${field("dialect", "Dialecte *", seg("dialect", c.dialects), "wide")}
        ${field("speaker", "Locuteur *", seg("speaker", speakerChoices(c.used_speakers, m.speaker))
          + `<input type="text" id="convSpeaker" value="${escapeHtml(m.speaker || "")}" placeholder="autre : S1+S2…"
               autocomplete="off" title="Saisir un autre locuteur (ex. S1+S2)" style="width:120px;margin-top:4px">
             <div class="speaker-note" id="speakerNote"></div>`)}
        ${field("flags", "Indicateurs", `<div class="checks">${c.flags.map(f =>
          `<label><input type="checkbox" data-flag="${escapeHtml(f)}" ${m.flags.includes(f) ? "checked" : ""}> ${escapeHtml(f)}</label>`).join("")}</div>`, "wide")}
        <div class="field wide keep exclu">
          <label><input type="checkbox" id="convExcluded" ${state.excluded ? "checked" : ""}> Exclure ce segment</label>
          <select id="convReason" ${state.excluded ? "" : "disabled"}>
            <option value="">Raison…</option>
            ${c.exclude_reasons.map(r => `<option ${m.exclude_reason === r ? "selected" : ""}>${escapeHtml(r)}</option>`).join("")}
          </select>
        </div>
      </div>
      <div class="conv-errors" id="convErrors"></div>
    </div>`;
}

function refreshConventionPanel() {
  const panel = document.getElementById("conv");
  if (!panel) return;
  panel.classList.toggle("is-excluded", state.excluded);
  panel.querySelectorAll(".field[data-field]").forEach(f =>
    f.classList.toggle("unconfirmed", state.unconfirmed.has(f.dataset.field)));
  panel.querySelectorAll("[data-set]").forEach(b =>
    b.classList.toggle("on", state.meta[b.dataset.set] === b.dataset.value));
  const sp = document.getElementById("convSpeaker");
  if (sp && document.activeElement !== sp) sp.value = state.meta.speaker || "";
  const note = document.getElementById("speakerNote");
  if (note) note.textContent = state.tagSpeaker ? `Suit les balises du texte (règle 8.5)` : "";
  document.getElementById("convReason").disabled = !state.excluded;
  const btn = document.getElementById("saveBtn");
  btn.textContent = state.excluded ? "Exclure & Next" : "Save & Next";
  btn.classList.toggle("excl", state.excluded);
}

function conventionChanged(key) {
  if (key) state.unconfirmed.delete(key);
  syncSpeakers();
  document.getElementById("convErrors").textContent = "";
  document.querySelectorAll(".conv .field.missing").forEach(f => f.classList.remove("missing"));
  refreshConventionPanel();
  scheduleLiveCheck();
  clearTimeout(state.saveTimer);
  state.saveTimer = setTimeout(() => autoSave(), 1500);
}

function wireConventionPanel() {
  const panel = document.getElementById("conv");
  if (!panel) return;
  panel.addEventListener("mousedown", e => { if (e.target.closest("button")) e.preventDefault(); });
  panel.querySelectorAll("[data-set]").forEach(b => b.onclick = () => {
    state.meta[b.dataset.set] = b.dataset.value;
    conventionChanged(b.dataset.set);
  });
  const speaker = document.getElementById("convSpeaker");
  speaker.oninput = () => { state.meta.speaker = speaker.value.trim().toUpperCase().replace(/\s+/g, ""); conventionChanged("speaker"); };
  speaker.onblur = () => refreshConventionPanel();  // shows the value the text's tags may have imposed
  panel.querySelectorAll("[data-flag]").forEach(cb => cb.onchange = () => {
    state.meta.flags = [...panel.querySelectorAll("[data-flag]:checked")].map(x => x.dataset.flag);
    conventionChanged();
  });
  document.getElementById("convExcluded").onchange = (e) => { state.excluded = e.target.checked; conventionChanged(); };
  document.getElementById("convReason").onchange = (e) => { state.meta.exclude_reason = e.target.value; conventionChanged(); };
  document.querySelectorAll("#tagbar [data-tag]").forEach(b => {
    b.onmousedown = e => e.preventDefault();
    b.onclick = () => insertTag(b.dataset.tag);
  });
  refreshConventionPanel();
  runLiveCheck();
}

// --- Split a segment at a speaker change (rules 8.1 / 8.5) --------------------------------
// The audio is cut at the playback position; the text is shared out at the text cursor.
async function reloadTasks(selectIdx) {
  const r = await fetch(`/api/projects/${encodeURIComponent(state.project)}/tasks`);
  setTasks((await r.json()).tasks || []);
  renderSidebar();
  renderAssignBar();
  // The same segment number if it is still visible, otherwise the closest one.
  if (state.tasks.length) {
    const near = state.tasks.reduce((a, b) => Math.abs(b.index - selectIdx) < Math.abs(a.index - selectIdx) ? b : a);
    select(near.index);
  }
}

async function splitSegment(idx) {
  const t = taskAt(idx), ta = document.getElementById("annotation");
  if (!state.ws || !t || !ta) return;
  state.ws.pause();
  const at = state.ws.getCurrentTime(), dur = state.ws.getDuration();
  if (at < 0.2 || at > dur - 0.2) {
    alert("Placez d'abord la lecture au changement de locuteur : cliquez sur la forme d'onde à l'endroit de la coupe.");
    return;
  }
  const cursor = document.activeElement === ta ? ta.selectionStart : savedCursor;
  const textA = ta.value.slice(0, cursor).trim(), textB = ta.value.slice(cursor).trim();
  const short = s => s ? `« ${s.length > 60 ? s.slice(0, 60) + "…" : s} »` : "(vide)";
  if (!confirm(`Couper ce segment à ${at.toFixed(2)} s ?\n\n`
      + `Partie 1 (0 – ${at.toFixed(2)} s) : ${short(textA)}\n`
      + `Partie 2 (${at.toFixed(2)} – ${dur.toFixed(2)} s) : ${short(textB)}\n\n`
      + "Le texte est réparti à la position du curseur dans la transcription. "
      + "Locuteur, langue et dialecte seront à confirmer sur chaque partie. La découpe peut être annulée.")) return;
  const r = await fetch(`/api/projects/${encodeURIComponent(state.project)}/tasks/${idx}/split`, {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ audio: t.audio, at, text_a: textA, text_b: textB }),
  });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) { alert(j.error || `Découpe impossible (HTTP ${r.status}).`); if (j.stale) reloadTasks(idx); return; }
  await reloadTasks(idx);
}

async function unsplitSegment(idx) {
  const t = taskAt(idx);
  if (!t || !confirm("Annuler la découpe ? Les deux parties redeviennent le segment d'origine, "
      + "avec la transcription qu'il avait avant la découpe. Le travail fait sur les deux parties sera perdu.")) return;
  const r = await fetch(`/api/projects/${encodeURIComponent(state.project)}/split/${encodeURIComponent(t.audio)}`, { method: "DELETE" });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) { alert(j.error || `Annulation impossible (HTTP ${r.status}).`); return; }
  await reloadTasks(j.index);
}

// --- Tag bar ----------------------------------------------------------------------------
// Inserts a tag at the cursor; "(())" wraps the selection as an uncertain word and ticks the
// matching flag (the convention requires it with ((mot))).
function insertTag(tag) {
  const ta = document.getElementById("annotation");
  if (!ta) return;
  const start = document.activeElement === ta ? ta.selectionStart : savedCursor;
  const end = document.activeElement === ta ? ta.selectionEnd : savedCursor;
  const v = ta.value;
  let insert, caret;
  if (tag === "(())") {
    const word = v.slice(start, end).trim();
    insert = `((${word}))`;
    caret = word ? start + insert.length : start + 2;
    if (!state.meta.flags.includes("transcription incertaine")) toggleFlag("transcription incertaine", true);
  } else {
    if (tag === "[personnel]" && state.conv.flags.includes("données personnelles")
        && !state.meta.flags.includes("données personnelles")) toggleFlag("données personnelles", true);
    const before = start > 0 && !/\s/.test(v[start - 1]) ? " " : "";
    const after = /^\s/.test(v.slice(end)) ? "" : " ";
    insert = before + tag + after;
    caret = start + insert.length;
  }
  ta.value = v.slice(0, start) + insert + v.slice(end);
  ta.focus();
  ta.setSelectionRange(caret, caret);
  savedCursor = caret;
  ta.dispatchEvent(new Event("input"));
}

function toggleFlag(flag, on) {
  setFlag(flag, on);
  conventionChanged();
}

function setFlag(flag, on) {
  const flags = new Set(state.meta.flags);
  on ? flags.add(flag) : flags.delete(flag);
  state.meta.flags = (state.conv?.flags || []).filter(f => flags.has(f));
  document.querySelectorAll("#conv [data-flag]").forEach(cb => { cb.checked = flags.has(cb.dataset.flag); });
}

// --- Rule 8.5 kept in step ----------------------------------------------------------------
// [S1] … [S2] tags in the text set the speaker (S1+S2) and win over a click on one speaker;
// removing tags brings the speaker back to the one left. A speaker with "+" ticks
// "plusieurs locuteurs"; a single speaker with no tag in the text unticks it.
const FLAG_MULTI = "plusieurs locuteurs";
const speakerNum = s => parseInt(s.slice(1), 10);

function speakerTags(text) {
  const ids = new Set([...(text || "").matchAll(/\[(S\d+)\]/g)].map(m => m[1]));
  return [...ids].sort((a, b) => speakerNum(a) - speakerNum(b));
}

// The speaker who talks last in a text with speaker tags ("[S1] … [S2] … [S1] …" -> S1).
function lastTagSpeaker(text) {
  const all = [...(text || "").matchAll(/\[(S\d+)\]/g)];
  return all.length ? all[all.length - 1][1] : null;
}

// Brings speaker and flag in line with the text; returns true when it changed something.
function syncSpeakers() {
  if (!state.conv || state.excluded) return false;
  const ta = document.getElementById("annotation");
  const tags = speakerTags(ta ? ta.value : "");
  const m = state.meta, before = m.speaker, hadFlag = m.flags.includes(FLAG_MULTI);
  if (tags.length >= 2) {
    if (!state.tagSpeaker) state.speakerBeforeTags = m.speaker;
    m.speaker = tags.join("+");
    state.tagSpeaker = true;
  } else if (state.tagSpeaker) {
    // Tags were removed: back to the one left, or to the speaker chosen before the tags.
    const back = (state.speakerBeforeTags || "").includes("+") ? null : state.speakerBeforeTags;
    m.speaker = tags[0] || back || (m.speaker || "").split("+")[0];
    if (!tags.length) state.tagSpeaker = false;
  }
  if (m.speaker !== before) state.unconfirmed.delete("speaker");
  if (state.conv.flags.includes(FLAG_MULTI)) {
    if ((m.speaker || "").includes("+") || tags.length >= 2) setFlag(FLAG_MULTI, true);
    else if (!tags.length && m.speaker) setFlag(FLAG_MULTI, false);
  }
  return m.speaker !== before || m.flags.includes(FLAG_MULTI) !== hadFlag;
}

// --- Live checks --------------------------------------------------------------------------
// The server holds the rules; it answers with blocking errors and warnings, some with a fix.
let liveSeq = 0;
function scheduleLiveCheck() {
  clearTimeout(state.liveTimer);
  state.liveTimer = setTimeout(runLiveCheck, 400);
}

async function runLiveCheck() {
  const ta = document.getElementById("annotation");
  if (!ta || !state.conv || state.current == null) return;
  const seq = ++liveSeq, idx = state.current;
  try {
    const r = await fetch(`/api/projects/${encodeURIComponent(state.project)}/tasks/${idx}/check`, {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ text: ta.value, meta: state.meta }),
    });
    const j = await r.json();
    if (seq === liveSeq && idx === state.current) renderLiveChecks(state.excluded ? { errors: [], warnings: [] } : j);
  } catch (e) { /* the save-time check still applies */ }
}

// "(règle 8.5)" in a message links to that rule on the convention page.
function ruleLinks(html) {
  return html.replace(/(règles? )(\d+(?:\.\d+)?)/g, (_, w, n) =>
    `${w}<a href="/documentation#regle-${n.replace(".", "-")}" target="labelin-convention">${n}</a>`);
}

function renderLiveChecks({ errors, warnings }) {
  const box = document.getElementById("liveChecks");
  if (!box) return;
  const items = [...errors.map(e => ({ ...e, kind: "err" })), ...warnings.map(w => ({ ...w, kind: "warn" }))];
  state.liveFixes = items.map(i => i.fix);
  box.innerHTML = items.map((i, n) => `
    <div class="item ${i.kind}">
      <span class="kind">${i.kind === "err" ? "bloquant" : "à vérifier"}</span>
      <span class="msg">${ruleLinks(escapeHtml(i.msg))}</span>
      ${i.fix ? `<button type="button" data-fix="${n}">${escapeHtml(i.fix.label)}</button>` : ""}
    </div>`).join("");
  box.querySelectorAll("[data-fix]").forEach(b => {
    b.onmousedown = e => e.preventDefault();
    b.onclick = () => applyFix(state.liveFixes[+b.dataset.fix]);
  });
}

function applyFix(fix) {
  const ta = document.getElementById("annotation");
  if (!fix || !ta) return;
  if (fix.type === "flag") toggleFlag(fix.value, true);
  else if (fix.type === "speaker") {
    state.meta.speaker = fix.value;
    document.getElementById("convSpeaker").value = fix.value;
    conventionChanged("speaker");
  } else if (fix.type === "lang") {
    state.meta.lang = fix.value;
    conventionChanged("lang");
  } else if (fix.type === "replace") {
    ta.value = ta.value.split(fix.from).join(fix.to);
    ta.dispatchEvent(new Event("input"));
  } else if (fix.type === "capitalize") {
    ta.value = ta.value.replace(/^((?:\s*\[[^\]]*\])*\s*(?:\(\()?)(\p{Ll})/u, (_, pre, c) => pre + c.toUpperCase());
    ta.dispatchEvent(new Event("input"));
  }
}

function showConventionErrors(errors) {
  const box = document.getElementById("convErrors");
  if (box) box.textContent = errors.join("\n");
  const m = state.meta;
  document.querySelectorAll(".conv .field[data-field]").forEach(f => {
    const k = f.dataset.field;
    f.classList.toggle("missing", k in FIELD_LABELS && !state.excluded && !m[k]);
  });
  document.getElementById("conv")?.scrollIntoView({ block: "nearest", behavior: "smooth" });
}

// Silently saves the current annotation as "autosave" status after a debounce delay.
async function autoSave() {
  const ta = document.getElementById("annotation");
  if (!ta) return;
  const text = ta.value.trim();
  const status = "autosave";
  const idx = state.current;
  if (state.saveController) state.saveController.abort();
  const controller = new AbortController();
  state.saveController = controller;
  try {
    const r = await fetch(`/api/projects/${encodeURIComponent(state.project)}/tasks/${idx}`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ text, status, audio: taskAt(idx).audio, ...(state.conv ? { meta: confirmedMeta() } : {}) }),
      signal: controller.signal,
    });
    const j = await r.json();
    if (j.ok) {
      taskAt(idx).annotation = text;
      taskAt(idx).status = j.annotation.status;
      taskAt(idx).updated_by = j.annotation.updated_by;
      taskAt(idx).done_by = j.annotation.done_by;
      taskAt(idx).corrected_by = j.annotation.corrected_by || [];
      taskAt(idx).meta = j.annotation.meta;
      taskAt(idx).convention = j.annotation.convention;
      document.getElementById("saveStatus").textContent = "✓ auto-saved";
      document.getElementById("saveStatus").classList.add("autosaved");
      renderSidebar();
      renderNasButtons(state.project);
    }
  } catch (e) {
    if (e.name === "AbortError") return;
    console.warn("autoSave failed", e);
  }
}

// Saves the current annotation with an explicit status and optionally advances to the next task.
async function save(advance, statusOverride) {
  clearTimeout(state.saveTimer);
  const ta = document.getElementById("annotation");
  if (!ta) return;
  const text = ta.value.trim();
  const status = statusOverride || (state.excluded ? "excluded" : text || state.conv ? "done" : "pending");
  const idx = state.current;
  if (state.conv && (status === "done" || status === "excluded")) {
    const problems = conventionProblems(text);
    if (problems.length) {
      showConventionErrors(problems);
      document.getElementById("saveStatus").textContent = "";
      return;
    }
  }
  // Capture next filtered index before save, in case the status change drops this task from the filter
  const nextIdx = advance ? getNextFilteredIndex(idx) : -1;
  document.getElementById("saveStatus").textContent = "saving…";
  const r = await fetch(`/api/projects/${encodeURIComponent(state.project)}/tasks/${idx}`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ text, status, audio: taskAt(idx).audio, ...(state.conv ? { meta: confirmedMeta() } : {}) }),
  });
  const j = await r.json();
  if (j.stale) {
    // Keep the typed text where possible (the clipboard needs https).
    try { await navigator.clipboard.writeText(text); } catch (e) { /* not available */ }
    alert("La liste des segments a changé : quelqu'un a découpé un segment. Elle va être rechargée, "
      + "puis enregistrez de nouveau. Votre texte a été copié dans le presse-papiers si le navigateur le permet.");
    return reloadTasks(idx);
  }
  if (!j.ok && j.errors) {
    showConventionErrors(j.errors);
    document.getElementById("saveStatus").textContent = "";
    return;
  }
  if (j.ok) {
    taskAt(idx).annotation = text;
    taskAt(idx).status = status;
    taskAt(idx).updated_by = j.annotation.updated_by;
    taskAt(idx).done_by = j.annotation.done_by;
    taskAt(idx).corrected_by = j.annotation.corrected_by || [];
    taskAt(idx).meta = j.annotation.meta;
    taskAt(idx).convention = j.annotation.convention;
    if (state.conv && j.annotation.meta) {
      const used = state.conv.used_speakers, sp = j.annotation.meta.speaker;
      if (sp && !used.includes(sp)) used.push(sp);
    }
    if (status === "done") learnWords(text);
    document.getElementById("saveStatus").textContent = "✓ saved";
    document.getElementById("saveStatus").classList.add("saved");
    renderSidebar();
    renderNasButtons(state.project);
    if (advance) {
      if (nextIdx >= 0) goto(nextIdx);
      else {
        const filtered = getFilteredTasks();
        if (filtered.length) goto(filtered[0].index);
      }
    }
  } else {
    document.getElementById("saveStatus").textContent = "save failed";
  }
}

// Returns the subset of tasks matching the active sidebar filter.
function getFilteredTasks() {
  return state.tasks.filter(t =>
    state.filter === "all" ? true :
    state.filter === "done" ? t.status === "done" :
    state.filter === "pending" ? t.status === "pending" :
    state.filter === "review" ? (t.status === "review" || t.status === "autosave") :
    state.filter === "excluded" ? t.status === "excluded" :
    state.filter === "loops" ? isLoopToReview(t) :
    true
  ).filter(t =>
    // Admins only: "Assigné à" filter.
    !state.assignFilter ? true :
    state.assignFilter === "__none__" ? !(t.assignees || []).length :
    (t.assignees || []).includes(state.assignFilter)
  );
}

// A likely Whisper loop that nobody has validated or excluded yet.
function isLoopToReview(t) {
  return !!t.loop && t.status !== "done" && t.status !== "excluded";
}

// Returns the task index that follows the current one within the filtered list, or -1 if at the end.
function getNextFilteredIndex(currentIdx) {
  const filtered = getFilteredTasks();
  const pos = filtered.findIndex(t => t.index === currentIdx);
  if (pos === -1 || pos >= filtered.length - 1) return -1;
  return filtered[pos + 1].index;
}

// Returns the task index that precedes the current one within the filtered list, or -1 if at the start.
function getPrevFilteredIndex(currentIdx) {
  const filtered = getFilteredTasks();
  const pos = filtered.findIndex(t => t.index === currentIdx);
  if (pos <= 0) return -1;
  return filtered[pos - 1].index;
}

// Navigates to the task at idx if it is within bounds.
function goto(idx) {
  if (!taskAt(idx)) return;
  select(idx);
}

// Escapes a string for safe insertion into HTML to prevent XSS.
function escapeHtml(s) {
  return String(s ?? "").replace(/[&<>"']/g, c => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  })[c]);
}

// Wire up sidebar filter buttons to re-render the task list on click.
document.querySelectorAll(".filter button").forEach(b => {
  b.onclick = () => {
    state.filter = b.dataset.filter;
    document.querySelectorAll(".filter button").forEach(x =>
      x.classList.toggle("active", x === b));
    renderSidebar();
  };
});

// Global keyboard shortcuts for saving, navigating, playback, and loop controls.
document.addEventListener("keydown", (e) => {
  const ta = document.getElementById("annotation");
  if (e.ctrlKey && e.key === "Enter") { e.preventDefault(); save(true); return; }
  if (e.ctrlKey && (e.key === "d" || e.key === "D")) {
    e.preventDefault();
    const cur = taskAt(state.current);
    if (ta) ta.value = (cur?.predictions?.[0]?.text) || cur?.prediction || "";
    return;
  }
  // Alt+1…n: insert the allowed tags in schema order, then ((mot)).
  if (e.altKey && !e.ctrlKey && state.conv && /^Digit[1-9]$/.test(e.code)) {
    const tags = [...state.conv.tags, "(())"];
    const tag = tags[+e.code.slice(5) - 1];
    if (tag) { e.preventDefault(); insertTag(tag); return; }
  }
  // Typing in the convention fields: keep normal keys (Tab moves between fields).
  if (document.activeElement?.closest?.("#conv")) return;
  if (e.key === "Tab") {
    e.preventDefault();
    goto(e.shiftKey ? getPrevFilteredIndex(state.current) : getNextFilteredIndex(state.current));
    return;
  }
  if (document.activeElement === ta) return;
  if (e.key === " ") {
    e.preventDefault();
    state.ws?.playPause();
  } else if (e.key === "r" || e.key === "R") {
    if (!state.ws) return;
    const start = state.loop && state.loopRegion ? state.loopRegion.start : 0;
    state.ws.setTime(start);
    state.ws.play();
  } else if (e.key === "[") {
    setLoopStartAtPlayhead();
  } else if (e.key === "]") {
    setLoopEndAtPlayhead();
  } else if (e.key === "l" || e.key === "L") {
    state.loop = !state.loop;
    updateLoopButtonStates();
  } else if (e.key === "\\") {
    clearLoop();
  }
});

// Syncs the autoplay toggle button with state and persists the preference to localStorage.
function initAutoplayBtn() {
  const autoplayBtn = document.getElementById("autoplayBtn");
  if (!autoplayBtn) return;
  autoplayBtn.checked = state.autoplay;
  autoplayBtn.onchange = () => {
    state.autoplay = autoplayBtn.checked;
    localStorage.setItem("labelin.autoplay", state.autoplay);
  };
}

// Applies the given colour theme to the document and saves the preference.
function setTheme(theme) {
  const isLight = theme === "light";
  document.documentElement.classList.toggle("light-theme", isLight);
  const themeBtn = document.getElementById("themeBtn");
  if (themeBtn) themeBtn.checked = isLight;
  const themeIcon = document.getElementById("themeIcon");
  if (themeIcon) themeIcon.textContent = isLight ? "☀️" : "🌙";
  localStorage.setItem("labelin.theme", theme);
}

// Switches between light and dark themes.
function toggleTheme() {
  setTheme(document.documentElement.classList.contains("light-theme") ? "dark" : "light");
}

// Overflow menu toggle
const overflowBtn = document.getElementById("overflowBtn");
const overflowDropdown = document.getElementById("overflowDropdown");
overflowBtn.onclick = (e) => { e.stopPropagation(); overflowDropdown.classList.toggle("open"); };
document.addEventListener("click", () => overflowDropdown.classList.remove("open"));
overflowDropdown.onclick = (e) => {
  if (e.target.tagName === "BUTTON" || e.target.tagName === "A") {
    overflowDropdown.classList.remove("open");
  }
};

// NAS action delegation
document.getElementById("nasActions").addEventListener("click", (e) => {
  const btn = e.target.closest("[data-nas]");
  if (!btn) return;
  const name = btn.closest("#nasActions")._nasProject;
  if (!name) return;
  if (btn.dataset.nas === "backup") doBackup(name);
  else if (btn.dataset.nas === "sync") doSync(name);
});

document.getElementById("themeBtn").onchange = toggleTheme;

const savedTheme = localStorage.getItem("labelin.theme");
setTheme(savedTheme === "light" ? "light" : "dark");

fetchProjects();
</script>
